[project]
name = "toothfairyvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Katharina", email = "17561951+KatyFisch@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[project.scripts]
toothfairyvision = "toothfairyvision:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
